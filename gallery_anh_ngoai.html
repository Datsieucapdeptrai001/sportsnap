  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }

  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }

  input { min-width:240px; flex:1; }
  main { padding:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; transition:transform .15s; }
  .card:hover { transform:translateY(-2px); border-color:#3b82f6; }
  .thumb { position:relative; aspect-ratio:1/1; background:#09101b; cursor:zoom-in; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .badge { position:absolute; top:8px; right:8px; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:700; color:#09101b; }
  .badge.ok { background:var(--ok); }
  .badge.bad { background:var(--bad); color:#fff; }
  .sport-tag { position:absolute; top:8px; left:8px; background:rgba(9,16,27,.82); padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .body { padding:10px 12px; font-size:12px; display:flex; flex-direction:column; gap:4px; }
  .fname { font-weight:600; font-size:13px; }
  .pred { color:var(--muted); }
  .pred strong { color:var(--text); }
  .src { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .src a { color:#60a5fa; text-decoration:none; }
  dialog { border:none; border-radius:14px; background:var(--card); color:var(--text); max-width:720px; width:92vw; padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.78); }
  dialog img { width:100%; max-height:65vh; object-fit:contain; border-radius:10px; background:#09101b; }
</style>

const sportSel = document.getElementById('sport');
const statusSel = document.getElementById('status');
const qInput = document.getElementById('q');
const grid = document.getElementById('grid');
const dlg = document.getElementById('dlg');

[...new Set(ITEMS.map(x => x.sport))].sort().forEach(s => {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  sportSel.appendChild(opt);
});

function render() {
  const q = qInput.value.trim().toLowerCase();
  const sp = sportSel.value;
  const st = statusSel.value;
  const filtered = ITEMS.filter(x => {
    if (sp && x.sport !== sp) return false;
    if (st === 'ok' && !x.correct) return false;
    if (st === 'bad' && x.correct) return false;
    if (st === 'low' && x.conf >= 60) return false;
    if (q && !`${x.sport} ${x.filename} ${x.pred} ${x.title}`.toLowerCase().includes(q)) return false;
    return true;
  });
  grid.innerHTML = '';
  for (const x of filtered) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">
        <img src="${encodeURI(x.rel)}" alt="${x.sport}/${x.filename}" loading="lazy" />
        <span class="sport-tag">${x.sport}</span>
        <span class="badge ${x.correct ? 'ok' : 'bad'}">${x.conf}%</span>
      </div>
      <div class="body">
        <div class="fname">${x.sport}/${x.filename}</div>
        <div class="pred">ResNet50: <strong>${x.pred}</strong> (${x.conf}%)</div>
        <div class="src" title="${x.title.replace(/"/g, '&quot;')}">
          ${x.url ? `<a href="${x.url}" target="_blank" rel="noopener">${x.title || 'Wikimedia'}</a>` : (x.title || '—')}
        </div>
      </div>
    `;
    card.querySelector('.thumb').onclick = () => {
      document.getElementById('dlgTitle').textContent = `${x.sport}/${x.filename}`;
      document.getElementById('dlgImg').src = encodeURI(x.rel);
      document.getElementById('dlgMeta').textContent = `ResNet50 dự đoán: ${x.pred} (${x.conf}%) | Nguồn: ${x.title}`;
      dlg.showModal();
    };
    grid.appendChild(card);
  }
}
qInput.oninput = render;
sportSel.onchange = render;
statusSel.onchange = render;
render();
</script>
